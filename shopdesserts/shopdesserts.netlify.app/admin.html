<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị viên - Shop Desserts</title>
    <style>
        body {
            font-family: sans-serif;
            background: #fcf8f7;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #260f08;
        }

        /* Menu Tab */
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: #eee;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            color: #87635a;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: #c73a0f;
            color: white;
        }

        /* Nội dung các bảng */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #c73a0f;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        #product-form {
            display: grid;
            gap: 10px;
            max-width: 600px;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #eee;
            margin-bottom: 30px;
        }

        #product-form input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>Hệ thống Quản trị</h1>
            <a href="index.html" style="color: #c73a0f; font-weight: bold; text-decoration: none;">← Quay lại Shop</a>
        </div>

        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchTab('orders-tab', this)">Kiểm tra đơn hàng</button>
            <button class="tab-btn" onclick="switchTab('products-tab', this)">Quản lý kho hàng (CRUD)</button>
        </div>


        <div id="orders-tab" class="tab-content active">
            <h2>Lịch sử đơn hàng toàn hệ thống</h2>
            <table>
                <thead>
                    <tr>
                        <th>Thông tin khách hàng</th> <!-- Đổi tên từ "Người dùng" thành "Thông tin khách hàng" -->
                        <th>Mã đơn</th>
                        <th>Ngày đặt</th>
                        <th>Chi tiết</th>
                        <th>Tổng tiền</th>
                    </tr>
                </thead>
                <tbody id="all-orders-list"></tbody>
            </table>
        </div>

        <div id="products-tab" class="tab-content">
            <h2>Thêm sản phẩm mới</h2>
            <form id="product-form">
                <input type="text" id="p-name" placeholder="Tên sản phẩm (vd: Classic Waffle)" required>
                <input type="text" id="p-category" placeholder="Loại (vd: Waffle)" required>
                <input type="number" id="p-price" placeholder="Giá ($)" step="0.01" required>
                <input type="text" id="p-image" placeholder="Link ảnh (vd: ./assets/images/image.jpg)" required>
                <button type="submit"
                    style="background: #1ea475; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 5px; font-weight: bold;">Lưu
                    sản phẩm</button>
            </form>

            <h2>Danh sách sản phẩm hiện có</h2>
            <table>
                <thead>
                    <tr>
                        <th>Ảnh</th>
                        <th>Tên sản phẩm</th>
                        <th>Giá</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="admin-product-list"></tbody>
            </table>
        </div>
    </div>

    <script src="admin.js"></script>
    <script>
        // Hàm chuyển đổi Tab
        function switchTab(tabId, btn) {
            // Ẩn tất cả nội dung
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            // Bỏ active tất cả nút
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            // Hiện tab được chọn
            document.getElementById(tabId).classList.add('active');
            // Active nút được chọn
            btn.classList.add('active');
        }
    </script>
</body>

</html>
