<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang cá nhân - Desserts Shop</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            background: #fcf8f7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #c73a0f;
            border: 2px solid #c73a0f;
            flex-shrink: 0;
        }

        .profile-info {
            flex-grow: 1;
        }

        .profile-info h2 {
            margin: 0;
            color: #260f08;
        }

        .profile-info p {
            color: #87635a;
            margin: 5px 0;
        }

        .display-contact {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            font-size: 14px;
        }

        .edit-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        .edit-section h3 {
            margin-top: 0;
            color: #260f08;
            border-bottom: 2px solid #fcf8f7;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #87635a;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .btn-update {
            background: #1ea475;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-update:hover {
            background: #168a62;
        }

        .order-item {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 5px solid #c73a0f;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            color: #260f08;
        }
    </style>
</head>

<body style="background-color: #fcf8f7;">

    <div class="profile-container">
        <header style="margin-bottom: 30px;">
            <a href="index.html" style="text-decoration: none; color: #87635a; font-weight: bold;">← Quay lại cửa
                hàng</a>
        </header>

        <!-- CARD THÔNG TIN CÁ NHÂN -->
        <div class="profile-card">
            <div class="profile-avatar" id="user-initial">?</div>
            <div class="profile-info">
                <h2 id="profile-name">Tên người dùng</h2>
                <p id="profile-role"
                    style="font-weight: bold; text-transform: uppercase; font-size: 12px; color: #c73a0f;"></p>
                <p id="profile-id">ID: #0000</p>

                <div class="display-contact">
                    <p><strong>Email:</strong> <span id="display-email"></span></p>
                    <p><strong>SĐT:</strong> <span id="display-phone"></span></p>
                </div>

                <button onclick="handleLogout()"
                    style="margin-top: 15px; background: none; border: 1px solid #c73a0f; color: #c73a0f; padding: 5px 15px; border-radius: 20px; cursor: pointer;">
                    Đăng xuất
                </button>
            </div>
        </div>

        <!-- FORM CẬP NHẬT THÔNG TIN LIÊN HỆ -->
        <div class="edit-section">
            <h3>Bổ sung thông tin liên hệ</h3>
            <div class="form-group">
                <label>Email (Gmail):</label>
                <input type="email" id="input-email" placeholder="Nhập địa chỉ email của bạn">
            </div>
            <div class="form-group">
                <label>Số điện thoại:</label>
                <input type="text" id="input-phone" placeholder="Nhập số điện thoại liên hệ">
            </div>
            <button class="btn-update" onclick="saveProfileInfo()">Cập nhật thông tin</button>
        </div>

        <!-- FORM ĐỔI MẬT KHẨU -->
        <div class="edit-section">
            <h3 style="color: #260f08;">Đổi mật khẩu</h3>
            <div class="form-group">
                <label>Mật khẩu hiện tại:</label>
                <input type="password" id="old-pass" placeholder="Nhập mật khẩu đang dùng">
            </div>
            <div class="form-group">
                <label>Mật khẩu mới:</label>
                <input type="password" id="new-pass" placeholder="Nhập mật khẩu mới">
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu mới:</label>
                <input type="password" id="confirm-new-pass" placeholder="Nhập lại mật khẩu mới">
            </div>
            <button class="btn-update" onclick="changePassword()" style="background-color: #260f08;">
                Xác nhận đổi mật khẩu
            </button>
        </div>

        <!-- LỊCH SỬ ĐƠN HÀNG -->
        <div class="order-history-section">
            <h3 style="color: #260f08;">Lịch sử mua hàng của bạn</h3>
            <div id="personal-orders"></div>
        </div>
    </div>

    <script src="profile.js"></script>
</body>

</html>
